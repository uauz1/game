    <meta name="application-name" content="قدّها" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('qaddha_site_prefs_v1') || '{}');
          const preference = ['dark', 'light', 'system'].includes(saved.theme) ? saved.theme : 'dark';
          const display = ['auto', 'mobile', 'tv'].includes(saved.display) ? saved.display : 'auto';
          const theme = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : preference;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.dataset.qaddhaDisplay = display;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#F4F1E9' : '#0B1020');
        } catch {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.qaddhaDisplay = 'auto';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
